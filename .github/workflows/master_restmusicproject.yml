# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy ASP.Net Core app to Azure Web App - RESTmusicProject

on:
  push:
    branches:
      - 'master'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Test backend
        run: dotnet test xUnitTest/RepositoryTest.csproj --configuration Release

      - name: dotnet publish
        # Medtag .NET, så publiceringen ikke kræver samme runtime-version på Azure.
        # Kun webprojektet skal i pakken; testprojektet skal ikke publiceres.
        run: dotnet publish RESTmusic/RESTmusic.csproj -c Release --runtime win-x64 --self-contained true -p:AspNetCoreHostingModel=OutOfProcess -o "${{env.DOTNET_ROOT}}/myapp"

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ${{env.DOTNET_ROOT}}/myapp

  deploy:
    runs-on: windows-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_DFEA6D129853408085C78CC1478D110A }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_209D58E668A041828E4C85B577FC3925 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_33EC2532164B40BBB52D328967AE5B8D }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'RESTmusicProject'
          slot-name: 'Production'
          package: .

      - name: Check deployed API
        shell: pwsh
        run: |
          $api = 'https://restmusicproject-g5aee9cthpghdcd9.swedencentral-01.azurewebsites.net/api/Collection'
          for ($attempt = 1; $attempt -le 12; $attempt++) {
            try {
              $response = Invoke-WebRequest $api -TimeoutSec 20
              if ($response.StatusCode -eq 200) {
                $null = $response.Content | ConvertFrom-Json
                Write-Output 'Deployed API responds with JSON.'
                exit 0
              }
            } catch {
              Write-Output "API not ready (attempt $attempt of 12)."
            }
            Start-Sleep -Seconds 10
          }
          throw 'The deployed API did not become available.'
          
